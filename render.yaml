services:
  - type: web
    name: klinika-omborxona-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMINS
        value: "475334833"
      - key: DB_NAME
        value: "omborxona.db"
